<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelHead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px 60px;
      color: #f4eaff;
      background:
        radial-gradient(ellipse 600px 320px at 50% 0%, rgba(255,46,203,0.12), transparent 70%),
        linear-gradient(180deg, #170a2e 0%, #0d0620 45%, #060310 100%);
    }

    /* ---------- hero / sun ---------- */
    .hero {
      position: relative;
      margin: 0 0 8px;
    }
    .horizon {
      height: 170px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #2a1150 0%, #170a2e 100%);
      border-bottom: 2px solid #ff2ecb;
      box-shadow: 0 1px 24px rgba(255, 46, 203, 0.5);
    }
    .horizon::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(45, 226, 255, 0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 226, 255, 0.5) 1px, transparent 1px);
      background-size: 100% 10px, 40px 100%;
      transform: perspective(70px) rotateX(48deg) scaleX(2.8) scaleY(1.6);
      transform-origin: bottom;
      opacity: 0.5;
    }
    .horizon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff3b0 0%, #ff9d5c 45%, #ff2ecb 100%);
      box-shadow: 0 0 34px rgba(255, 157, 92, 0.65);
    }
    .hero h1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -68%);
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 21px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      z-index: 2;
      color: #2a1150;
    }
    .hero .tagline {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 30%);
      margin: 0;
      z-index: 2;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #3a1a5c;
    }
    .build-note {
      margin: 10px 0 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #a98fd6;
    }

    #tracks {
      margin-top: 20px;
    }
    .track {
      padding: 12px 14px;
      border: 1px solid #4a2b7a;
      border-radius: 6px;
      background: rgba(30, 14, 58, 0.6);
      box-shadow: inset 0 0 0 1px rgba(45, 226, 255, 0.06);
      margin-bottom: 10px;
      font-size: 14px;
    }
    .track.is-lead {
      border-color: #ff2ecb;
      box-shadow: 0 0 14px rgba(255, 46, 203, 0.35), inset 2px 0 0 #ff2ecb;
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .track-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      color: #f4eaff;
    }
    .track-meta {
      font-family: 'JetBrains Mono', monospace;
      color: #a98fd6;
    }
    .lead-toggle {
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4a2b7a;
      background: transparent;
      color: #a98fd6;
      cursor: pointer;
    }
    .track.is-lead .lead-toggle {
      border-color: #ff2ecb;
      background: #ff2ecb;
      color: #2a0620;
      box-shadow: 0 0 10px rgba(255, 46, 203, 0.6);
    }
    .meter {
      margin-top: 8px;
      height: 8px;
      border-radius: 4px;
      background: #170a2e;
      border: 1px solid #3a2160;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2de2ff, #ff2ecb);
      box-shadow: 0 0 10px rgba(255, 46, 203, 0.6);
      /* no transition — meters should track the signal directly, not lag it */
    }
    .overrides {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .override-row {
      display: grid;
      grid-template-columns: 36px 1fr 90px 24px;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #a98fd6;
    }
    .override-row input[type="range"] {
      width: 100%;
      accent-color: #ff2ecb;
    }
    .override-value {
      font-variant-numeric: tabular-nums;
      color: #a98fd6;
      text-align: right;
    }
    .override-reset {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #6b4c99;
      padding: 2px;
    }
    .override-reset:disabled {
      color: #3a2160;
      cursor: default;
    }
    .override-reset:not(:disabled):hover {
      color: #2de2ff;
    }
    .reasons {
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #a98fd6;
    }
    .reasons summary {
      cursor: pointer;
      color: #2de2ff;
    }
    .reasons ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }
    .reasons li {
      margin-bottom: 3px;
    }
    #errors {
      margin-top: 12px;
      color: #ff2ecb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }
    #drop-zone {
      margin-top: 20px;
      border: 2px dashed #4a2b7a;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: #a98fd6;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
    }
    #drop-zone.dragover {
      border-color: #2de2ff;
      color: #f4eaff;
      background: rgba(45, 226, 255, 0.06);
    }
    #transport {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #transport button {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 4px;
      border: 1px solid #4a2b7a;
      background: #170a2e;
      color: #2de2ff;
      cursor: pointer;
    }
    #transport button:disabled {
      background: #1c1230;
      border-color: #2c1c48;
      color: #4a3a6e;
      cursor: not-allowed;
    }
    #transport-time {
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace;
      color: #a98fd6;
      font-size: 14px;
    }
    .export-btn {
      margin-left: auto;
      border-color: #ff2ecb !important;
      color: #ff2ecb !important;
      box-shadow: 0 0 10px rgba(255, 46, 203, 0.35);
    }
    .export-btn:disabled {
      border-color: #2c1c48 !important;
      color: #4a3a6e !important;
      box-shadow: none;
    }
    #preset-panel {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #4a2b7a;
      border-radius: 6px;
      background: rgba(30, 14, 58, 0.6);
    }
    #preset-panel label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #2de2ff;
      margin-right: 8px;
    }
    #preset-select {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #4a2b7a;
      background: #170a2e;
      color: #f4eaff;
    }
    #preset-description {
      margin: 8px 0 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #a98fd6;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="horizon"></div>
    <h1>LevelHead</h1>
    <p class="tagline">Automatic mixing tool</p>
  </div>
  <p class="build-note">Under construction. See PROGRESS.md.</p>

  <div id="drop-zone">
    Drop audio files here, or click to choose files
    <input type="file" id="file-input" accept="audio/*" multiple hidden>
  </div>

  <div id="preset-panel">
    <label for="preset-select">Genre preset</label>
    <select id="preset-select"></select>
    <p id="preset-description"></p>
  </div>

  <div id="errors"></div>
  <div id="tracks"></div>

  <div id="transport">
    <button id="play-btn" disabled>▶ Play mix</button>
    <button id="pause-btn" disabled>⏸ Pause</button>
    <button id="stop-btn" disabled>■ Stop</button>
    <span id="transport-time"></span>
    <button id="export-btn" disabled class="export-btn">⬇ Export mix</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
