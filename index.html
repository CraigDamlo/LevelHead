<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelHead</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    #tracks {
      margin-top: 20px;
    }
    .track {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      gap: 12px;
    }
    .track.is-lead {
      border-color: #c9a227;
      background: #fffbea;
    }
    .lead-toggle {
      flex-shrink: 0;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    .track.is-lead .lead-toggle {
      border-color: #c9a227;
      background: #c9a227;
      color: #fff;
    }
      font-size: 14px;
    }
    .track-name {
      font-weight: 600;
    }
    .track-meta {
      color: #666;
    }
    #errors {
      margin-top: 12px;
      color: #b00020;
      font-size: 14px;
    }
    #drop-zone {
      margin-top: 20px;
      border: 2px dashed #bbb;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: #666;
      cursor: pointer;
    }
    #drop-zone.dragover {
      border-color: #666;
      color: #222;
      background: #fafafa;
    }
    #transport {
      margin-top: 20px;
    }
    #play-btn {
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    #play-btn:disabled {
      background: #ccc;
      border-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>LevelHead</h1>
  <p>Automatic mixing tool — under construction. See PROGRESS.md.</p>

  <div id="drop-zone">
    Drop audio files here, or click to choose files
    <input type="file" id="file-input" accept="audio/*" multiple hidden>
  </div>

  <div id="errors"></div>
  <div id="tracks"></div>

  <div id="transport">
    <button id="play-btn" disabled>▶ Play mix</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
