<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelHead</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    #tracks {
      margin-top: 20px;
    }
    .track {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .track.is-lead {
      border-color: #c9a227;
      background: #fffbea;
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .track-name {
      font-weight: 600;
    }
    .track-meta {
      color: #666;
    }
    .lead-toggle {
      flex-shrink: 0;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    .track.is-lead .lead-toggle {
      border-color: #c9a227;
      background: #c9a227;
      color: #fff;
    }
    .meter {
      margin-top: 8px;
      height: 6px;
      border-radius: 3px;
      background: #eee;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: #2e7d32;
      /* no transition — meters should track the signal directly, not lag it */
    }
    .overrides {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .override-row {
      display: grid;
      grid-template-columns: 36px 1fr 90px 24px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #444;
    }
    .override-row input[type="range"] {
      width: 100%;
    }
    .override-value {
      font-variant-numeric: tabular-nums;
      color: #666;
      text-align: right;
    }
    .override-reset {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      padding: 2px;
    }
    .override-reset:disabled {
      color: #ddd;
      cursor: default;
    }
    .override-reset:not(:disabled):hover {
      color: #222;
    }
    .reasons {
      margin-top: 8px;
      font-size: 13px;
      color: #444;
    }
    .reasons summary {
      cursor: pointer;
      color: #666;
    }
    .reasons ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }
    .reasons li {
      margin-bottom: 3px;
    }
    #errors {
      margin-top: 12px;
      color: #b00020;
      font-size: 14px;
    }
    #drop-zone {
      margin-top: 20px;
      border: 2px dashed #bbb;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: #666;
      cursor: pointer;
    }
    #drop-zone.dragover {
      border-color: #666;
      color: #222;
      background: #fafafa;
    }
    #transport {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #transport button {
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    #transport button:disabled {
      background: #ccc;
      border-color: #ccc;
      cursor: not-allowed;
    }
    #transport-time {
      font-variant-numeric: tabular-nums;
      color: #666;
      font-size: 14px;
    }
    .export-btn {
      margin-left: auto;
      background: #1a5c2e !important;
      border-color: #1a5c2e !important;
    }
    .export-btn:disabled {
      background: #ccc !important;
      border-color: #ccc !important;
    }
    #preset-panel {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }
    #preset-panel label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-right: 8px;
    }
    #preset-select {
      font-size: 14px;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #preset-description {
      margin: 8px 0 0;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>LevelHead</h1>
  <p>Automatic mixing tool — under construction. See PROGRESS.md.</p>

  <div id="drop-zone">
    Drop audio files here, or click to choose files
    <input type="file" id="file-input" accept="audio/*" multiple hidden>
  </div>

  <div id="preset-panel">
    <label for="preset-select">Genre preset</label>
    <select id="preset-select"></select>
    <p id="preset-description"></p>
  </div>

  <div id="errors"></div>
  <div id="tracks"></div>

  <div id="transport">
    <button id="play-btn" disabled>▶ Play mix</button>
    <button id="pause-btn" disabled>⏸ Pause</button>
    <button id="stop-btn" disabled>■ Stop</button>
    <span id="transport-time"></span>
    <button id="export-btn" disabled class="export-btn">⬇ Export mix</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
